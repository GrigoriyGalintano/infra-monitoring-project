name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Bash and Docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Check public API
        run: ./check_api.sh https://httpbin.org/status/200

      - name: Check generated log statistics
        run: |
          ./analyze_logs.sh | tee "$RUNNER_TEMP/log-analysis.txt"
          test "$(wc -l < access.log)" -eq 360
          grep -Fx 'Общее количество запросов: 360' "$RUNNER_TEMP/log-analysis.txt"
          grep -Fx '  192.0.2.10: 180' "$RUNNER_TEMP/log-analysis.txt"
          grep -Fx '  198.51.100.5: 108' "$RUNNER_TEMP/log-analysis.txt"
          grep -Fx '  203.0.113.8: 54' "$RUNNER_TEMP/log-analysis.txt"
          grep -Fx 'Запросов с кодами 4xx: 90' "$RUNNER_TEMP/log-analysis.txt"
          grep -Fx 'Запросов с кодами 5xx: 60' "$RUNNER_TEMP/log-analysis.txt"

      - name: Start Docker stack
        run: |
          docker compose config --quiet
          docker compose up -d
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 5 http://localhost:80 > "$RUNNER_TEMP/echo-response.txt"
          grep -Fx 'Monitoring Service Active' "$RUNNER_TEMP/echo-response.txt"
          ./check_api.sh http://localhost:80

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down
